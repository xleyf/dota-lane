name: Encrypted Supabase backup

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check backup configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          if [[ -n "$SUPABASE_DB_URL" && -n "$BACKUP_PASSPHRASE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Add SUPABASE_DB_URL and BACKUP_PASSPHRASE in repository Actions secrets to enable backups."
          fi

      - name: Install Supabase CLI
        if: steps.config.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump application schema and data
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          DB_URLS="$(python3 - <<'PY'
          import os
          from urllib.parse import quote, unquote

          value = os.environ["SUPABASE_DB_URL"].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
              value = value[1:-1]
          scheme, separator, remainder = value.partition("://")
          userinfo, at, host_and_path = remainder.rpartition("@")
          username, colon, password = userinfo.partition(":")
          host, slash, database = host_and_path.partition("/")
          if (scheme not in ("postgres", "postgresql") or not separator or not at or
                  not colon or not username or not password or not host or not slash or not database or
                  "\n" in value or "\r" in value):
              raise SystemExit("SUPABASE_DB_URL must be a complete PostgreSQL URI from Supabase → Connect → Session pooler.")
          # Try both raw and URL-encoded password forms. Never print either URI in the job log.
          print(f"{scheme}://{quote(username, safe='')}:{quote(password, safe='')}@{host}/{database}")
          decoded_password = unquote(password)
          if decoded_password != password:
              print(f"{scheme}://{quote(username, safe='')}:{quote(decoded_password, safe='')}@{host}/{database}")
          PY
          )"
          mapfile -t DB_URL_CANDIDATES <<< "$DB_URLS"
          DB_URL=""
          for candidate in "${DB_URL_CANDIDATES[@]}"; do
            echo "::add-mask::$candidate"
            if supabase db dump --db-url "$candidate" --schema public --file "$RUNNER_TEMP/schema.sql"; then
              DB_URL="$candidate"
              break
            fi
            rm -f "$RUNNER_TEMP/schema.sql"
          done
          if [[ -z "$DB_URL" ]]; then
            echo "::error::Database authentication failed. Check the Supabase database password in SUPABASE_DB_URL."
            exit 1
          fi
          supabase db dump --db-url "$DB_URL" --schema public --data-only --use-copy --file "$RUNNER_TEMP/data.sql"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lane-database.tar.gz" schema.sql data.sql

      - name: Encrypt backup
        if: steps.config.outputs.configured == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$RUNNER_TEMP/lane-database.tar.gz.gpg" \
            "$RUNNER_TEMP/lane-database.tar.gz"
          rm -f "$RUNNER_TEMP/schema.sql" "$RUNNER_TEMP/data.sql" "$RUNNER_TEMP/lane-database.tar.gz"

      - name: Store encrypted backup for 30 days
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/lane-database.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30


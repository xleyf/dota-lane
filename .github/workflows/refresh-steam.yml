name: Refresh Steam Hero Builds

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-steam-builds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public Steam guide index
        run: python scripts/import_steam_builds.py
      - name: Commit changed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-builds.json
          if git diff --cached --quiet; then
            echo "Steam guide index is unchanged"
          else
            git commit -m "Refresh Steam Hero Builds index"
            git push
          fi
